<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OfficeBridge</title>
<style>
  :root {
    --blue: #0c51a1; --blue-tint: #eaf1fb; --bg: #f8fafc; --border: #e3e7ee;
    --text: #1a1a1a; --muted: #666666; --deny: #c73434;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, 'Malgun Gothic', sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
    -webkit-user-select: none; user-select: none;
  }
  .header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: #fff; }
  .brand { font-weight: 700; color: var(--blue); font-size: 14px; }
  .who { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .list { padding: 8px; overflow-y: auto; max-height: 260px; }
  .item {
    padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; font-weight: 600;
  }
  .item:hover { background: var(--blue-tint); }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.6; }
  .footer {
    padding: 10px 16px; border-top: 1px solid var(--border); background: #fff;
    display: flex; justify-content: space-between; align-items: center; font-size: 11.5px;
  }
  .footer a { color: var(--muted); text-decoration: none; cursor: pointer; }
  .app-footer {
    padding: 6px 16px; border-top: 1px solid var(--border); background: #fafafa;
    text-align: right; font-size: 10.5px;
  }
  .app-footer a { color: var(--muted); text-decoration: none; cursor: pointer; }

  .login { padding: 20px 18px; }
  .login .brand { font-size: 16px; margin-bottom: 2px; }
  .login .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .login label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  .login input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: #fff; color: var(--text);
  }
  .login button {
    width: 100%; margin-top: 16px; background: var(--blue); color: #fff; border: none;
    padding: 9px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .login .error { color: var(--deny); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div id="loginView" class="login" style="display:none">
    <div class="brand">OfficeBridge</div>
    <div class="sub">회사코드와 포털 계정으로 최초 1회만 인증하면, 이후로는 로그인 없이 접속됩니다.</div>
    <form id="loginForm">
      <label>회사코드</label>
      <input type="text" id="companyCode" placeholder="예: AMD" required>
      <label>이메일</label>
      <input type="email" id="email" placeholder="you@company.com" required>
      <label>비밀번호</label>
      <input type="password" id="password" required>
      <button type="submit">인증하고 시작</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <div id="mainView" style="display:none">
    <div class="header">
      <div class="brand">OfficeBridge</div>
      <div class="who" id="who">확인 중…</div>
    </div>
    <div class="list" id="list"></div>
    <div class="footer">
      <span></span>
      <a id="forgetLink">로그아웃</a>
    </div>
  </div>

  <div class="app-footer"><a id="quitLink">앱 종료</a></div>

<script>
  const loginView = document.getElementById('loginView');
  const mainView = document.getElementById('mainView');
  const who = document.getElementById('who');
  const list = document.getElementById('list');
  const loginError = document.getElementById('loginError');

  document.getElementById('forgetLink').addEventListener('click', async () => {
    await window.bridge.forget();
    refresh();
  });

  document.getElementById('quitLink').addEventListener('click', () => {
    window.bridge.quit();
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    const companyCode = document.getElementById('companyCode').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await window.bridge.register(companyCode, email, password);
      refresh();
    } catch (err) {
      loginError.textContent = err.message
        .replace(/^Error invoking remote method[^:]*:\s*/, '')
        .replace(/^Error:\s*/, '');
    }
  });

  function showLogin(message) {
    loginView.style.display = 'block';
    mainView.style.display = 'none';
    loginError.textContent = message || '';
  }

  function showMain(data) {
    loginView.style.display = 'none';
    mainView.style.display = 'block';

    if (data.error) {
      who.textContent = '연결 실패';
      list.innerHTML = `<div class="empty">${data.error}</div>`;
      return;
    }
    who.textContent = `${data.name}님 · ${data.dept}`;
    if (!data.services || !data.services.length) {
      list.innerHTML = '<div class="empty">아직 접근 가능한 시스템이 없습니다.<br>관리자에게 권한을 요청하세요.</div>';
      return;
    }
    list.innerHTML = '';
    data.services.forEach((s) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = s.label || s.name;
      item.addEventListener('click', () => window.bridge.openService(s.url));
      list.appendChild(item);
    });
  }

  async function refresh() {
    let data;
    try {
      data = await window.bridge.getStatus();
    } catch (err) {
      data = { error: err.message };
    }
    if (data.needsAuth) {
      showLogin(data.revokedMessage);
      return;
    }
    showMain(data);
  }

  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
