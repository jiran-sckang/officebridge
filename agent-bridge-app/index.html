<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OfficeBridge</title>
<style>
  :root {
    --blue: #0c51a1; --blue-tint: #eaf1fb; --bg: #f8fafc; --border: #e3e7ee;
    --text: #1a1a1a; --muted: #666666; --deny: #c73434;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, 'Malgun Gothic', sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
    -webkit-user-select: none; user-select: none;
  }
  .header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: #fff; }
  .brand { font-weight: 700; color: var(--blue); font-size: 14px; }
  .who { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .list { padding: 8px; overflow-y: auto; max-height: 260px; }
  .item {
    padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; font-weight: 600;
  }
  .item:hover { background: var(--blue-tint); }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.6; }
  .empty button {
    margin-top: 10px; background: var(--blue); color: #fff; border: none;
    padding: 8px 16px; border-radius: 6px; font-size: 12.5px; cursor: pointer;
  }
  .footer {
    padding: 10px 16px; border-top: 1px solid var(--border); background: #fff;
    display: flex; justify-content: space-between; align-items: center; font-size: 11.5px;
  }
  .footer a { color: var(--muted); text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">OfficeBridge</div>
    <div class="who" id="who">확인 중…</div>
  </div>
  <div class="list" id="list"></div>
  <div class="footer">
    <a id="importLink">설정파일 가져오기</a>
    <a id="forgetLink">로그아웃</a>
  </div>

<script>
  const who = document.getElementById('who');
  const list = document.getElementById('list');
  document.getElementById('importLink').addEventListener('click', async () => {
    const ok = await window.bridge.importConfig();
    if (ok) refresh();
  });
  document.getElementById('forgetLink').addEventListener('click', async () => {
    await window.bridge.forget();
    refresh();
  });

  function render(data) {
    if (data.needsConfig) {
      who.textContent = '설정 필요';
      list.innerHTML = `<div class="empty">
        아직 이 컴퓨터에 브릿지 설정파일이 없습니다.<br>관리자에게 받은 설정파일을 가져와주세요.
        <br><button id="importBtn">설정파일 가져오기</button>
      </div>`;
      document.getElementById('importBtn').addEventListener('click', async () => {
        const ok = await window.bridge.importConfig();
        if (ok) refresh();
      });
      return;
    }
    if (data.error) {
      who.textContent = '연결 실패';
      list.innerHTML = `<div class="empty">${data.error}</div>`;
      return;
    }
    who.textContent = `${data.name}님 · ${data.dept}`;
    if (!data.services || !data.services.length) {
      list.innerHTML = '<div class="empty">아직 접근 가능한 시스템이 없습니다.<br>관리자에게 권한을 요청하세요.</div>';
      return;
    }
    list.innerHTML = '';
    data.services.forEach((s) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = s.label || s.name;
      item.addEventListener('click', () => window.bridge.openService(s.url));
      list.appendChild(item);
    });
  }

  async function refresh() {
    try {
      render(await window.bridge.getStatus());
    } catch (err) {
      render({ error: err.message });
    }
  }

  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
